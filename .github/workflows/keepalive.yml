# Free Supabase projects pause after ~7 days without activity.
# This pings the database API twice a week so it stays awake over winter.
name: Keep Supabase awake

on:
  schedule:
    - cron: '17 3 * * 1,4'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            'https://vnozbfquhuimrfhwhabl.supabase.co/rest/v1/lists?select=id&limit=1' \
            -H 'apikey: sb_publishable_I4Qr-HguGHNmY_FAMPK5ZQ_Qzk_Gnol')
          echo "HTTP $code"
          # 401/403 is expected (anon has no access); anything 5xx means trouble.
          test "$code" -lt 500
