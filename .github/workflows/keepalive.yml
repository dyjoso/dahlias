# Free Supabase projects pause after ~7 days without activity.
# This calls the keepalive() database function (supabase/migrate_005_keepalive.sql)
# every day, which runs a real query so it counts as activity.
name: Keep Supabase awake

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Call keepalive()
        run: |
          code=$(curl -s -o response.txt -w '%{http_code}' -X POST \
            'https://vnozbfquhuimrfhwhabl.supabase.co/rest/v1/rpc/keepalive' \
            -H 'apikey: sb_publishable_I4Qr-HguGHNmY_FAMPK5ZQ_Qzk_Gnol' \
            -H 'Content-Type: application/json' -d '{}')
          echo "HTTP $code"; cat response.txt; echo
          # Fail loudly (GitHub emails you) unless the query actually ran.
          test "$code" -ge 200 -a "$code" -lt 300
